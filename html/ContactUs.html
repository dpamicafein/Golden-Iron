<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="../css/ContactUs_Styles.css" />
  <title>Document</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      transition: background-color 0.3s, color 0.3s;
    }

    body.light-mode {
      background-color: #f4f4f4;
      color: #000;
    }

    body.dark-mode {
      background-color: #0f1a23;
      color: #fff;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background-color: #0f1a23;
      color: white;
    }

    .navbar.dark-mode {
      background-color: #ffffff;
      color: #000;
    }

    .navbar-center {
      flex: 1;
      text-align: center;
    }

    .home-link {
      font-weight: bold;
      color: #000000;
      text-decoration: none;
      font-size: 16px;
      transition: color 0.3s;
    }

    .home-link:hover {
      color: #00adb5;
    }

    .light-mode .home-link {
      color: #eeeeee;
    }

    .icons {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .theme-icon {
      width: 30px;
      height: 30px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .theme-icon:hover {
      transform: scale(1.1);
    }

    .icon-btn {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 30px;
      height: 30px;
      border: 2px dashed #5fc9ff;
      border-radius: 50%;
      color: #5fc9ff;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .icon-btn:hover {
      background-color: #5fc9ff;
      color: #0f1a23;
    }

    .dark-mode .icon-btn {
      border-color: #0f1a23;
      color: #0f1a23;
    }

    .dark-mode .icon-btn:hover {
      background-color: #0f1a23;
      color: #ffffff;
    }

    input.dark-mode,
    select.dark-mode {
      background-color: #444;
      color: #fff;
      border: 1px solid #666;
    }

    input,
    select {
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .floating-order-btn {
      position: absolute;
      top: 140px;
      right: 20px;
      padding: 10px 18px;
      background-color: #5fc9ff;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s ease;
      z-index: 999;
    }

    .floating-order-btn:hover {
      background-color: #4fa8cc;
    }

    .light-mode .name {
      color: #000;
    }
  </style>
</head>
<body>

  <div id="navbar" class="navbar">
    <img src="../assets/imgs/Screenshot 2025-01-25 060236.png" alt="Solevya Logo" class="logo-img" width="80" height="60" />

    <div class="navbar-center">
      <a href="Gold Iron.html" class="home-link" id="home-btn" data-key="home">الصفحة الرئيسية</a>
    </div>

    <div class="icons">
      <img id="theme-icon" src="../assets/imgs/moon-icon-512x512-fm9crgpt.png" class="theme-icon" alt="تبديل الوضع" />
      <div id="language-icon" class="icon-btn">Ar</div>
    </div>
  </div>

  <a href="Order.html" class="floating-order-btn" data-key="order-btn">عرض الطلب</a>

  <br><br>

  <section class="hero">
    <div class="heroSub">
      <h1 class="name" style="text-align: center;" data-key="name h1">قسم الطلبات</h1>
      <h1 class="title" style="text-align: center;" data-key="title h1">في جولدن ايرون</h1>
    </div>
  </section>

  <br /><br /><br /><br />

  <section class="Works" id="OurWork">
    <div class="WorksContainer">
      <div class="ProjectTitle">
        <h1 class="name" style="text-align: center;" data-key="name">منتجاتنا</h1>
      </div>

      <br /><br />

      <ul class="projects-grid">
        <li class="project-card">
          <a href="Product.html">
            <img src="../assets/imgs/webApp.png" alt="Web App" />
          </a>
        </li>
        <li class="project-card">
          <a href="Product2.html">
            <img src="../assets/imgs/webApp.png" alt="Web App" />
          </a>
        </li>
        <li class="project-card">
          <a href="Product.html">
            <img src="../assets/imgs/webApp.png" alt="Web App" />
          </a>
        </li>
      </ul>

      <br /><br /><br /><br /><br />
    </div>
  </section>

  <script>
    const translations = {
      "name": { ar: "Our products", en: "منتجاتنا" },
      "name h1": { ar: "Order Department", en: "قسم الطلبات" },
      "title h1": { ar: "At Golden Iron", en: "في جولدن ايرون" },
      "order-btn": { ar: "View Order", en: "عرض الطلب" },
      "home": { ar: "Home", en: "الصفحة الرئيسية" }
    };

    const themeIcon = document.getElementById("theme-icon");
    const languageIcon = document.getElementById("language-icon");
    const body = document.body;
    const navbar = document.getElementById("navbar");
    const inputs = document.querySelectorAll("input, select");

    let currentLanguage = localStorage.getItem("language") || "ar";
    let currentTheme = localStorage.getItem("theme") || "light-mode";

    applyTheme(currentTheme);
    applyLanguage(currentLanguage);

    themeIcon.addEventListener("click", () => {
      currentTheme = currentTheme === "dark-mode" ? "light-mode" : "dark-mode";
      applyTheme(currentTheme);
      localStorage.setItem("theme", currentTheme);
    });

    languageIcon.addEventListener("click", () => {
      currentLanguage = currentLanguage === "ar" ? "en" : "ar";
      applyLanguage(currentLanguage);
      localStorage.setItem("language", currentLanguage);
    });

    function applyTheme(theme) {
      body.classList.remove("light-mode", "dark-mode");
      body.classList.add(theme);
      navbar.classList.remove("light-mode", "dark-mode");
      navbar.classList.add(theme);
      inputs.forEach((input) => {
        input.classList.remove("light-mode", "dark-mode");
        input.classList.add(theme);
      });
      themeIcon.src =
        theme === "dark-mode"
          ? "../assets/imgs/png-clipart-computer-icons-icon-design-black-sun-text-hand-thumbnail.png"
          : "../assets/imgs/moon-icon-512x512-fm9crgpt.png";
    }

    function applyLanguage(lang) {
      document.querySelectorAll("[data-key]").forEach((el) => {
        const key = el.getAttribute("data-key");
        el.textContent = translations[key][lang];
      });
      languageIcon.textContent = lang === "ar" ? "Ar" : "En";
    }
  </script>
</body>
</html>
